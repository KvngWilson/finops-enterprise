services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongodb_data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { if (db.hello().isWritablePrimary) quit(0); } catch(e) {} try { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}); } catch(e) {} quit(1)'"]
      interval: 5s
      timeout: 10s
      retries: 40
  migrate:
    build: ./backend
    command: ["node", "src/migrate.js"]
    environment: &db_env
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: finops
    depends_on:
      mongo:
        condition: service_healthy
  backend:
    build: ./backend
    environment:
      <<: *db_env
      PORT: 3000
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3128}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3128}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@finops.example}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set bootstrap password in .env}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set Keycloak client secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  nginx:
    image: nginx:alpine
    ports: ["3128:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports: ["127.0.0.1:8025:8025"]
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set database password}
    volumes: ["keycloak_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set Keycloak admin password}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set Keycloak client secret}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3128}
    ports: ["8081:8080"]
    volumes: ["./keycloak/finops-enterprise-realm.json:/opt/keycloak/data/import/finops-enterprise-realm.json:ro"]
    depends_on:
      mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports: ["127.0.0.1:8025:8025"]
  keycloak-db:
        condition: service_healthy
volumes:
  mongodb_data:
  keycloak_data:
